<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Premium Video Streaming App</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0f0f12;
      color: #ffffff;
      padding-bottom: 70px;
    }

    /* Header Styling */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(15, 15, 18, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #1a1a24;
    }

    .brand-logo {
      font-size: 18px;
      font-weight: 800;
      color: #e50914;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    #navProfileIcon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Search Box */
    .search-container {
      display: none;
      padding: 10px 16px;
      background: #181820;
    }

    .search-input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #333;
      background: #0f0f12;
      color: #fff;
      outline: none;
      font-size: 13px;
    }

    /* Category Bar */
    .cat-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .cat-bar::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: #1a1a24;
      color: #aaa;
      border: 1px solid #2a2a38;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
    }

    .cat-btn.active {
      background: #e50914;
      color: #fff;
      border-color: #e50914;
    }

    /* Banner Slider */
    .hero-slider-container {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      margin: 10px 16px;
      border-radius: 12px;
    }

    .hero-slider-container::-webkit-scrollbar { display: none; }

    .hero-banner {
      flex: 0 0 100%;
      scroll-snap-align: start;
      height: 180px;
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 15px;
      background-color: #1a1a24;
    }

    .hero-content {
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      width: 100%;
      padding: 10px;
      border-radius: 8px;
    }

    .hero-badge {
      background: #e50914;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .hero-title {
      font-size: 16px;
      font-weight: bold;
      margin: 4px 0;
    }

    .hero-desc {
      font-size: 11px;
      color: #ccc;
      margin-bottom: 8px;
    }

    .btn-play {
      background: #fff;
      color: #000;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Banner Ad Boxes */
    .ad-banner-box {
      margin: 10px 16px;
      text-align: center;
      background: #14141c;
      border-radius: 8px;
      overflow: hidden;
      min-height: 50px;
    }

    /* Video Section Grid */
    .category-section {
      margin-bottom: 20px;
    }

    .section-header {
      padding: 0 16px 8px 16px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      border-left: 3px solid #e50914;
      padding-left: 8px;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 16px;
    }

    .poster-card {
      position: relative;
      aspect-ratio: 2/3;
      border-radius: 8px;
      overflow: hidden;
      background-color: #181820;
      cursor: pointer;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.5);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
    }

    .poster-title-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px 6px 6px 6px;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    }

    .poster-title-text {
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .premium-lock-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(229, 9, 20, 0.85);
      color: #fff;
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 4px;
      z-index: 2;
    }

    .pin-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 11px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .pin-btn.pinned {
      color: #e50914;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 15, 18, 0.98);
      border-top: 1px solid #1a1a24;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #777;
      text-decoration: none;
      font-size: 10px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-link i { font-size: 16px; }

    .nav-link.active { color: #e50914; }

    /* Modals & Popups */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .lock-box, .timer-overlay-card {
      background: #181820;
      border: 1px solid #2a2a38;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      max-width: 320px;
      width: 100%;
    }

    .lock-btn {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
      cursor: pointer;
    }

    .timer-badge {
      background: #2a2a38;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      margin: 12px 0;
    }

    .ad-x-close-btn {
      background: #28a745;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    /* Player Modal */
    .player-modal-content {
      width: 100%;
      max-width: 700px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #14141c;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }

    .video-container iframe, .video-container video {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Auth & Profile Form */
    .profile-card {
      background: #181820;
      padding: 20px;
      margin: 20px 16px;
      border-radius: 12px;
      border: 1px solid #2a2a38;
      text-align: center;
    }

    .profile-img-container {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 12px auto;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .upload-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #e50914;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      cursor: pointer;
    }

    .auth-form {
      text-align: left;
      margin-top: 15px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 11px;
      color: #aaa;
      display: block;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 8px 12px;
      background: #0f0f12;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
    }

    .auth-btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary { background: #e50914; color: #fff; }
    .btn-google { background: #fff; color: #000; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .btn-danger { background: #dc3545; color: #fff; }

    .google-icon { width: 14px; height: 14px; }
    .auth-toggle { font-size: 11px; color: #e50914; text-align: center; margin-top: 10px; cursor: pointer; }
    
    .native-ad-container {
      grid-column: span 3;
      min-height: 80px;
      background: #14141c;
      border-radius: 8px;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <div class="brand-logo">
      <i class="fa-solid fa-play"></i> STREAM APP
    </div>
    <div class="header-icons">
      <button class="icon-btn" onclick="toggleSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="icon-btn" onclick="switchTab('profile', document.querySelectorAll('.nav-link')[3])">
        <i class="fa-solid fa-user" id="navProfileIcon"></i>
      </button>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="search-container" id="searchBox">
    <input type="text" class="search-input" id="searchInput" placeholder="Search videos..." oninput="handleSearch(event)">
  </div>

  <!-- Top Banner Ad Box -->
  <div class="ad-banner-box" id="topAdBox"></div>

  <!-- Category Bar -->
  <div class="cat-bar" id="catBar"></div>

  <!-- Hero Slider -->
  <div class="hero-slider-container" id="heroSlider"></div>

  <!-- Main Dynamic Area -->
  <div id="mainContentContainer"></div>

  <!-- Bottom Banner Ad Box -->
  <div class="ad-banner-box" id="bottomAdBox"></div>

  <!-- Adsterra Extra Ad Containers -->
  <div id="popunderAdContainer"></div>
  <div id="socialBarAdContainer"></div>

  <!-- Lock / Ad Counter Modal -->
  <div class="modal-overlay" id="lockModal">
    <div class="lock-box"></div>
  </div>

  <!-- Video Player Modal -->
  <div class="modal-overlay" id="playerModal">
    <div class="player-modal-content">
      <div class="player-header">
        <span id="modalTitle" style="font-size:12px; font-weight:bold;">Video Player</span>
        <button class="icon-btn" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="video-container" id="videoPlayerContainer"></div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-link active" onclick="switchTab('home', this)">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-link" onclick="switchTab('trending', this)">
      <i class="fa-solid fa-fire"></i>
      <span>Premium</span>
    </button>
    <button class="nav-link" onclick="switchTab('mylist', this)">
      <i class="fa-solid fa-bookmark"></i>
      <span>My List</span>
    </button>
    <button class="nav-link" onclick="switchTab('profile', this)">
      <i class="fa-solid fa-user"></i>
      <span>Profile</span>
    </button>
  </nav>

  <!-- Firebase JavaScript Module Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      sendEmailVerification, 
      updateProfile,
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import { firebaseConfig, IMGBB_API_KEY } from './config.js';

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUser = null;
    let videoAdProgress = {};
    let adTimerInterval = null;
    let userAccessStatus = 'none';

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      updateProfileUI();
      if (user) {
        checkUserAccessStatus();
      } else {
        userAccessStatus = 'none';
        renderVideos();
      }
    });

    function checkUserAccessStatus() {
      if (!currentUser) return;
      onValue(ref(db, `accessRequests/${currentUser.uid}`), (snapshot) => {
        if (snapshot.exists()) {
          userAccessStatus = snapshot.val().status || 'pending';
        } else {
          userAccessStatus = 'none';
        }
        renderVideos();
      });
    }

    let adUrlData = "";
    let adInterval = 0;
    let nativeAdCodeData = "";
    let allVideos = {};
    let premiumVideos = {};
    let categoriesList = [];
    let selectedCat = "All";
    let searchQuery = "";
    let autoSlideTimer = null;
    let currentTab = "home"; 
    let pinnedVideos = JSON.parse(localStorage.getItem('pinnedVideos') || '[]');

    // Read Admin Configuration
    onValue(ref(db, 'settings/adConfig'), (snapshot) => {
      const config = snapshot.val();
      if (config) {
        adUrlData = config.adUrl || "";
        adInterval = config.adInterval !== undefined ? parseInt(config.adInterval) : 0;
        nativeAdCodeData = config.nativeAdCode || "";

        if (config.topBannerCode) renderAnyAd('topAdBox', config.topBannerCode);
        if (config.bottomBannerCode) renderAnyAd('bottomAdBox', config.bottomBannerCode);
        if (config.popupAdCode) injectAdsterraScript(config.popupAdCode, 'popunderAdContainer');
        if (config.socialBarAdCode) injectAdsterraScript(config.socialBarAdCode, 'socialBarAdContainer');
      }
    });

    // Global Click Trigger
    document.addEventListener('click', function(e) {
      if (!adUrlData) return;
      if (e.target.closest('.close-modal, input, textarea, button')) return;

      const lastClickAdTime = localStorage.getItem('lastClickAdTime') || 0;
      const now = Date.now();

      if (now - lastClickAdTime >= 4000) {
        let targetUrl = adUrlData.trim();
        if (targetUrl.includes("src=")) {
          const match = targetUrl.match(/src=["']([^"']+)["']/);
          if (match && match[1]) targetUrl = match[1];
        }
        if (targetUrl) {
          window.open(targetUrl, '_blank');
          localStorage.setItem('lastClickAdTime', now);
        }
      }
    }, true);

    function injectAdsterraScript(scriptCode, containerId) {
      if (!scriptCode) return;
      let container = document.getElementById(containerId);
      if (!container) {
        container = document.createElement('div');
        container.id = containerId;
        document.body.appendChild(container);
      }
      container.innerHTML = "";
      
      const range = document.createRange();
      range.selectNode(container);
      const documentFragment = range.createContextualFragment(scriptCode);
      container.appendChild(documentFragment);
    }

    function renderAnyAd(containerId, rawCode) {
      const container = document.getElementById(containerId);
      if (!container || !rawCode) return;
      container.innerHTML = "";

      if (rawCode.startsWith("http://") || rawCode.startsWith("https://")) {
        const a = document.createElement('a');
        a.href = rawCode;
        a.target = "_blank";
        a.innerHTML = "<span style='color:#e50914; font-size:11px; font-weight:bold;'>Click Here To Watch Ad</span>";
        container.appendChild(a);
      } else {
        const iframe = document.createElement('iframe');
        iframe.style.border = 'none';
        iframe.style.width = '100%';
        iframe.style.height = '60px';
        iframe.style.overflow = 'hidden';
        container.appendChild(iframe);

        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(`<body style="margin:0; padding:0; display:flex; justify-content:center; align-items:center; background:transparent;">${rawCode}</body>`);
        doc.close();
      }
    }

    // Load Categories
    onValue(ref(db, 'categories'), (snapshot) => {
      categoriesList = [];
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(key => {
          categoriesList.push(data[key].name);
        });
      }
      renderCategoryBar();
    });

    // Normal Videos
    onValue(ref(db, 'videos'), (snapshot) => {
      allVideos = snapshot.val() || {};
      renderCategoryBar();
      renderVideos();
    });

    // Premium Videos
    onValue(ref(db, 'premiumVideos'), (snapshot) => {
      premiumVideos = snapshot.val() || {};
      if (currentTab === 'trending') renderVideos();
    });

    function renderCategoryBar() {
      const catBar = document.getElementById('catBar');
      if (!catBar) return;
      catBar.innerHTML = "";

      const allBtn = document.createElement('button');
      allBtn.className = `cat-btn ${selectedCat === 'All' ? 'active' : ''}`;
      allBtn.innerText = "All";
      allBtn.onclick = () => filterCat('All', allBtn);
      catBar.appendChild(allBtn);

      categoriesList.forEach(catName => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${selectedCat === catName ? 'active' : ''}`;
        btn.innerText = catName;
        btn.onclick = () => filterCat(catName, btn);
        catBar.appendChild(btn);
      });
    }

    window.filterCat = (catName, btnElement) => {
      selectedCat = catName;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      renderVideos();
    };

    // Hero Banners
    onValue(ref(db, 'heroBanners'), (snapshot) => {
      const heroSlider = document.getElementById('heroSlider');
      heroSlider.innerHTML = "";
      const data = snapshot.val();
      if (data) {
        const banners = Object.values(data);
        banners.forEach(b => {
          const div = document.createElement('div');
          div.className = 'hero-banner';
          div.style.backgroundImage = `url('${b.imgUrl}')`;
          
          div.onclick = () => {
            if (b.videoUrl) {
              handleVideoClick('banner_' + b.title, b, false);
            } else if (b.linkUrl) {
              window.open(b.linkUrl, '_blank');
            }
          };

          div.innerHTML = `
            <div class="hero-content">
              <span class="hero-badge">FEATURED</span>
              <h2 class="hero-title">${b.title || ''}</h2>
              <div class="hero-desc">${b.desc || ''}</div>
              <button class="btn-play"><i class="fa-solid fa-play"></i> Watch Now</button>
            </div>
          `;
          heroSlider.appendChild(div);
        });

        startAutoSlider(heroSlider, banners.length);
      } else {
        heroSlider.style.display = 'none';
      }
    });

    function startAutoSlider(slider, total) {
      if (autoSlideTimer) clearInterval(autoSlideTimer);
      if (total <= 1) return;

      let currentIndex = 0;
      autoSlideTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % total;
        const bannerWidth = slider.clientWidth;
        slider.scrollTo({
          left: bannerWidth * currentIndex,
          behavior: 'smooth'
        });
      }, 3500);
    }

    window.togglePin = (e, videoId) => {
      e.stopPropagation();
      const index = pinnedVideos.indexOf(videoId);
      if (index > -1) {
        pinnedVideos.splice(index, 1);
      } else {
        pinnedVideos.push(videoId);
      }
      localStorage.setItem('pinnedVideos', JSON.stringify(pinnedVideos));
      renderVideos();
    };

    function renderVideos() {
      const mainContainer = document.getElementById('mainContentContainer');
      mainContainer.innerHTML = "";

      if (currentTab === "profile") {
        renderProfileSection(mainContainer);
        return;
      }

      if (currentTab === "trending") {
        const headerDiv = document.createElement('div');
        headerDiv.className = 'section-header';
        headerDiv.innerHTML = `<span class="section-title">Premium Content</span>`;
        mainContainer.appendChild(headerDiv);

        const premGrid = document.createElement('div');
        premGrid.className = 'mini-grid';
        const keys = Object.keys(premiumVideos).reverse();
        let count = 0;

        keys.forEach((key, index) => {
          const item = premiumVideos[key];
          if (item.title && item.title.toLowerCase().includes(searchQuery.toLowerCase())) {
            count++;
            premGrid.appendChild(createCard(key, item, false, true));
            
            if (nativeAdCodeData && (index + 1) % 6 === 0) {
              const nativeBox = document.createElement('div');
              nativeBox.className = 'native-ad-container';
              premGrid.appendChild(nativeBox);
              renderAnyAdByElement(nativeBox, nativeAdCodeData);
            }
          }
        });

        if (count === 0) {
          mainContainer.innerHTML += "<p style='color:#888; font-size:11px; text-align:center; padding:30px;'>কোনো প্রিমিয়াম ভিডিও উপলব্ধ নেই!</p>";
        } else {
          mainContainer.appendChild(premGrid);
        }
        return;
      }

      if (currentTab === "mylist") {
        const myGrid = document.createElement('div');
        myGrid.className = 'mini-grid';
        let pinnedCount = 0;

        Object.keys(allVideos).reverse().forEach(key => {
          const item = allVideos[key];
          const isPinned = pinnedVideos.includes(key);
          const titleMatch = item.title && item.title.toLowerCase().includes(searchQuery.toLowerCase());

          if (isPinned && titleMatch) {
            pinnedCount++;
            myGrid.appendChild(createCard(key, item, isPinned, false));
          }
        });

        const headerDiv = document.createElement('div');
        headerDiv.className = 'section-header';
        headerDiv.innerHTML = `<span class="section-title">My Pinned Videos</span>`;
        mainContainer.appendChild(headerDiv);

        if (pinnedCount === 0) {
          mainContainer.innerHTML += "<p style='color:#888; font-size:11px; text-align:center; padding:30px;'>আপনার কোনো পিন করা ভিডিও নেই!</p>";
        } else {
          mainContainer.appendChild(myGrid);
        }
        return;
      }

      const keys = Object.keys(allVideos).reverse();
      const groupedVideos = {};
      
      keys.forEach(key => {
        const item = allVideos[key];
        const category = item.category || "Featured Videos";
        const titleMatch = item.title && item.title.toLowerCase().includes(searchQuery.toLowerCase());

        if (titleMatch) {
          if (!groupedVideos[category]) {
            groupedVideos[category] = [];
          }
          groupedVideos[category].push({ key, data: item });
        }
      });

      let totalRendered = 0;
      const categoriesToDisplay = selectedCat === "All" ? Object.keys(groupedVideos) : [selectedCat];

      categoriesToDisplay.forEach(catName => {
        const videoList = groupedVideos[catName];

        if (videoList && videoList.length > 0) {
          totalRendered += videoList.length;

          const section = document.createElement('div');
          section.className = 'category-section';

          const secHeader = document.createElement('div');
          secHeader.className = 'section-header';
          secHeader.innerHTML = `<span class="section-title">${catName}</span>`;

          const grid = document.createElement('div');
          grid.className = 'mini-grid';

          videoList.forEach((obj, idx) => {
            const isPinned = pinnedVideos.includes(obj.key);
            grid.appendChild(createCard(obj.key, obj.data, isPinned, false));

            if (nativeAdCodeData && (idx + 1) % 6 === 0) {
              const nativeBox = document.createElement('div');
              nativeBox.className = 'native-ad-container';
              grid.appendChild(nativeBox);
              renderAnyAdByElement(nativeBox, nativeAdCodeData);
            }
          });

          section.appendChild(secHeader);
          section.appendChild(grid);
          mainContainer.appendChild(section);
        }
      });

      if (totalRendered === 0) {
        mainContainer.innerHTML = "<p style='color:#888; font-size:11px; text-align:center; padding:20px;'>No videos found matching your request.</p>";
      }
    }

    function renderAnyAdByElement(container, rawCode) {
      if (!container || !rawCode) return;
      container.innerHTML = "";
      const iframe = document.createElement('iframe');
      iframe.style.border = 'none';
      iframe.style.width = '100%';
      iframe.style.height = '80px';
      iframe.style.overflow = 'hidden';
      container.appendChild(iframe);

      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(`<body style="margin:0; padding:0; display:flex; justify-content:center; align-items:center; background:transparent;">${rawCode}</body>`);
      doc.close();
    }

    function createCard(key, item, isPinned, isPremium) {
      const card = document.createElement('div');
      card.className = 'poster-card';
      
      const requiredAds = item.adLimit !== undefined ? parseInt(item.adLimit) : (adInterval || 1);
      const currentCount = videoAdProgress[key] || 0;
      
      const isUnlocked = isPremium ? (userAccessStatus === 'approved' || currentCount >= requiredAds) : (currentCount >= requiredAds);

      const rawCover = item.imgUrl || item.posterUrl || item.thumbnailUrl || (item.episodes && item.episodes[0] ? item.episodes[0].thumbnailUrl : '');
      const coverImage = (rawCover && rawCover.trim() !== '') ? rawCover : 'https://via.placeholder.com/300x450/1e1e1e/ffffff?text=Secret+Video';

      card.onclick = () => {
        handleVideoClick(key, item, isPremium);
      };

      card.innerHTML = `
        ${isPremium ? `
          <div class="premium-lock-badge">
            <i class="fa-solid ${isUnlocked ? 'fa-unlock' : 'fa-lock'}"></i>
          </div>
        ` : ''}
        ${!isPremium ? `<div class="pin-btn ${isPinned ? 'pinned' : ''}" onclick="togglePin(event, '${key}')" title="Pin Video"><i class="fa-solid fa-bookmark"></i></div>` : ''}
        
        <img src="${coverImage}" class="poster-img" alt="${item.title}" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x450/1e1e1e/ffffff?text=Poster';" oncontextmenu="return false;">
        
        <div class="play-overlay"><i class="fa-solid ${isPremium && !currentUser ? 'fa-lock' : 'fa-play'}"></i></div>
        <div class="poster-title-overlay">
          <span class="poster-title-text">${item.title}</span>
        </div>
      `;
      return card;
    }

    // Handle Clicks with Registration & Ad Checks
    function handleVideoClick(key, item, isPremium) {
      if (isPremium && !currentUser) {
        openAuthRequiredModal();
        return;
      }

      if (isPremium && userAccessStatus === 'approved') {
        openVideoPlayer(item.videoUrl, item.title);
        return;
      }

      const requiredAds = item.adLimit !== undefined ? parseInt(item.adLimit) : (adInterval || 0);
      if (!videoAdProgress[key]) videoAdProgress[key] = 0;

      if (videoAdProgress[key] < requiredAds) {
        openLockModal(key, item, videoAdProgress[key], requiredAds);
      } else {
        openVideoPlayer(item.videoUrl, item.title);
      }
    }

    function openAuthRequiredModal() {
      const modal = document.getElementById('lockModal');
      const lockBox = modal.querySelector('.lock-box');
      
      lockBox.className = "lock-box";
      lockBox.innerHTML = `
        <i class="fa-solid fa-user-lock" style="color:#e50914; font-size:40px; margin-bottom:10px;"></i>
        <h3>প্রিমিয়াম ভিডিও প্রটেকশন</h3>
        <p style="font-size:12px; color:#aaa; margin:8px 0 12px 0;">রেজিস্ট্রেশন বা লগইন করা ছাড়া প্রিমিয়াম ভিডিও প্লে করা সম্ভব নয়।</p>
        <button class="lock-btn" onclick="closeLockModal(); switchTab('profile', document.querySelectorAll('.nav-link')[3]);">লগইন / রেজিস্ট্রেশন করুন</button>
      `;
      modal.style.display = 'flex';
    }

    window.openLockModal = (key, item, currentCount, requiredAds) => {
      const modal = document.getElementById('lockModal');
      const lockBox = modal.querySelector('.lock-box');
      
      lockBox.className = "lock-box";
      lockBox.innerHTML = `
        <i class="fa-solid fa-circle-play" style="color:#e50914; font-size:40px; margin-bottom:10px;"></i>
        <h3>ভিডিওটি প্লে করতে এড দেখুন</h3>
        <p style="font-size:12px; color:#aaa; margin:8px 0;">ভিডিওটি চালু করতে আর মাত্র <b>${requiredAds - currentCount}</b> টি বিজ্ঞাপন দেখতে হবে।</p>
        <button class="lock-btn" style="margin-bottom:8px;" onclick="watchAdForVideo('${key}', '${item.videoUrl}', '${item.title}', ${requiredAds}, '${item.adUrl || ''}')">Watch Ad (${currentCount}/${requiredAds})</button>
        ${currentUser ? '<button class="lock-btn" style="background:#28a745;" onclick="sendAccessRequest()">এক্সেস রিকোয়েস্ট পাঠান</button>' : ''}
      `;
      modal.style.display = 'flex';
    };

    window.sendAccessRequest = async () => {
      if (!currentUser) return;
      try {
        await set(ref(db, `accessRequests/${currentUser.uid}`), {
          userEmail: currentUser.email,
          status: 'pending',
          requestedAt: new Date().toLocaleString()
        });
        alert("আপনার এক্সেস রিকোয়েস্ট এডমিনের কাছে পাঠানো হয়েছে!");
        closeLockModal();
      } catch(e) {
        alert("ত্রুটি: " + e.message);
      }
    };

    window.watchAdForVideo = (key, videoUrl, title, requiredAds, specificAdUrl) => {
      let targetUrl = specificAdUrl || adUrlData.trim() || "https://google.com";
      if (targetUrl.includes("src=")) {
        const match = targetUrl.match(/src=["']([^"']+)["']/);
        if (match && match[1]) targetUrl = match[1];
      }
      
      window.open(targetUrl, '_blank');

      const modal = document.getElementById('lockModal');
      const lockBox = modal.querySelector('.lock-box');

      lockBox.className = "timer-overlay-card";
      lockBox.innerHTML = `
        <i class="fa-solid fa-clock" style="font-size:35px; color:#ffc107; margin-bottom:8px;"></i>
        <h3 style="font-size:15px; margin-bottom:5px;">বিজ্ঞাপনটি দেখা শেষ হওয়া পর্যন্ত অপেক্ষা করুন</h3>
        <p style="font-size:11px; color:#aaa;">নতুন ট্যাবে অ্যাড প্লে হচ্ছে। 10 সেকেন্ড পর পয়েন্ট পাবেন।</p>
        
        <div id="adTimerBox" class="timer-badge">
          অ্যাড দেখা শেষ হতে বাকি: <span id="adSecondsLeft">10</span> সেকেন্ড
        </div>

        <button id="adCloseXBtn" class="ad-x-close-btn" style="display:none;" onclick="finishAdCount('${key}', '${videoUrl}', '${title}', ${requiredAds})">
          ✕ সম্পূর্ণ হয়েছে (পয়েন্ট নিন)
        </button>
      `;

      let timeLeft = 10;
      if (adTimerInterval) clearInterval(adTimerInterval);

      adTimerInterval = setInterval(() => {
        timeLeft--;
        const timerElem = document.getElementById('adSecondsLeft');
        if (timerElem) timerElem.innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(adTimerInterval);
          const timerBox = document.getElementById('adTimerBox');
          const closeBtn = document.getElementById('adCloseXBtn');
          if (timerBox) timerBox.style.display = 'none';
          if (closeBtn) closeBtn.style.display = 'block';
        }
      }, 1000);
    };

    window.finishAdCount = (key, videoUrl, title, requiredAds) => {
      videoAdProgress[key] = (videoAdProgress[key] || 0) + 1;

      if (videoAdProgress[key] >= requiredAds) {
        closeLockModal();
        renderVideos();
        openVideoPlayer(videoUrl, title);
      } else {
        openLockModal(key, { videoUrl, title }, videoAdProgress[key], requiredAds);
      }
    };

    window.closeLockModal = () => {
      if (adTimerInterval) clearInterval(adTimerInterval);
      const modal = document.getElementById('lockModal');
      modal.style.display = 'none';
    };

    window.switchTab = (tabName, navElement) => {
      currentTab = tabName;
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      navElement.classList.add('active');

      const heroSlider = document.getElementById('heroSlider');
      const catBar = document.getElementById('catBar');

      if (tabName === "mylist" || tabName === "trending" || tabName === "profile") {
        heroSlider.style.display = 'none';
        catBar.style.display = 'none';
      } else {
        heroSlider.style.display = 'flex';
        catBar.style.display = 'flex';
      }

      renderVideos();
    };

    function renderProfileSection(container) {
      if (!currentUser) {
        container.innerHTML = `
          <div class="profile-card">
            <h3 style="margin-bottom:8px;">Login or Register</h3>
            <p style="font-size:12px; color:#aaa; margin-bottom:15px;">গুগল অথবা ইমেইল দিয়ে লগইন করে আপনার প্রোফাইল অ্যাক্সেস করুন।</p>
            <button class="auth-btn btn-google" onclick="loginWithGoogle()">
              <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              Continue with Google
            </button>
            <hr style="margin:15px 0; border:none; border-top:1px solid #333;">
            <div id="authFormArea">
              ${renderLoginForm()}
            </div>
          </div>
        `;
      } else {
        const photo = currentUser.photoURL || 'https://via.placeholder.com/90';
        container.innerHTML = `
          <div class="profile-card">
            <div class="profile-img-container">
              <img src="${photo}" id="userAvatar" class="profile-img" oncontextmenu="return false;">
              <label for="imgUpload" class="upload-btn"><i class="fa-solid fa-camera"></i></label>
              <input type="file" id="imgUpload" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
            </div>
            <div style="font-size:16px; font-weight:bold; margin-bottom:4px;">${currentUser.displayName || 'User'}</div>
            <div style="font-size:12px; color:#aaa; margin-bottom:10px;">${currentUser.email}</div>
            <p style="font-size:12px; margin-bottom:12px; color: ${userAccessStatus === 'approved' ? '#28a745' : '#e50914'};">
              Status: <b>${userAccessStatus.toUpperCase()}</b>
            </p>
            <button class="auth-btn btn-danger" onclick="logoutUser()">
              <i class="fa-solid fa-right-from-bracket"></i> Sign Out
            </button>
          </div>
        `;
      }
    }

    function renderLoginForm() {
      return `
        <form onsubmit="handleEmailLogin(event)" class="auth-form">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" required placeholder="Enter email">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPass" required placeholder="Enter password">
          </div>
          <button type="submit" class="auth-btn btn-primary">Sign In</button>
          <div class="auth-toggle" onclick="toggleAuthForm('register')">Don't have an account? Register</div>
        </form>
      `;
    }

    function renderRegisterForm() {
      return `
        <form onsubmit="handleEmailRegister(event)" class="auth-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" required placeholder="Enter name">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" required placeholder="Enter valid email">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPass" required placeholder="Create password">
          </div>
          <button type="submit" class="auth-btn btn-primary">Create Account</button>
          <div class="auth-toggle" onclick="toggleAuthForm('login')">Already have an account? Sign In</div>
        </form>
      `;
    }

    window.toggleAuthForm = (type) => {
      const formArea = document.getElementById('authFormArea');
      if (type === 'register') {
        formArea.innerHTML = renderRegisterForm();
      } else {
        formArea.innerHTML = renderLoginForm();
      }
    };

    window.loginWithGoogle = () => {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider).then(() => {
        checkUserAccessStatus();
        renderVideos();
      }).catch(err => alert(err.message));
    };

    window.handleEmailRegister = (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPass').value;

      createUserWithEmailAndPassword(auth, email, pass).then((userCredential) => {
        const user = userCredential.user;
        updateProfile(user, { displayName: name });
        sendEmailVerification(user).then(() => {
          alert("রেজিস্ট্রেশন সফল হয়েছে! ইমেইল ভেরিফাই করুন।");
          signOut(auth);
          toggleAuthForm('login');
        });
      }).catch(err => alert(err.message));
    };

    window.handleEmailLogin = (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;

      signInWithEmailAndPassword(auth, email, pass).then((userCredential) => {
        if (!userCredential.user.emailVerified) {
          alert("আপনার ইমেইল ভেরিফাই করা হয়নি!");
          signOut(auth);
        } else {
          checkUserAccessStatus();
          renderVideos();
        }
      }).catch(err => alert(err.message));
    };

    window.logoutUser = () => {
      signOut(auth).then(() => {
        userAccessStatus = 'none';
        renderVideos();
      });
    };

    window.handleImageUpload = (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("image", file);

      alert("ছবি আপলোড হচ্ছে...");

      fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.data && data.data.url) {
          const newPhotoUrl = data.data.url;
          updateProfile(auth.currentUser, { photoURL: newPhotoUrl }).then(() => {
            alert("প্রোফাইল পিকচার আপডেট হয়েছে!");
            renderVideos();
          });
        }
      });
    };

    function updateProfileUI() {
      const profileNavBtn = document.getElementById('navProfileIcon');
      if (profileNavBtn) {
        if (currentUser && currentUser.photoURL) {
          profileNavBtn.outerHTML = `<img src="${currentUser.photoURL}" id="navProfileIcon">`;
        } else {
          profileNavBtn.outerHTML = `<i class="fa-solid fa-user" id="navProfileIcon"></i>`;
        }
      }
    }

    window.toggleSearch = () => {
      const searchBox = document.getElementById('searchBox');
      const searchInput = document.getElementById('searchInput');
      if (searchBox.style.display === 'block') {
        searchBox.style.display = 'none';
        searchQuery = "";
        searchInput.value = "";
        renderVideos();
      } else {
        searchBox.style.display = 'block';
        searchInput.focus();
      }
    };

    window.handleSearch = (e) => {
      searchQuery = e.target.value.trim();
      renderVideos();
    };

    // Video Player Trigger
    window.openVideoPlayer = (url, title) => {
      const modal = document.getElementById('playerModal');
      const videoContainer = document.getElementById('videoPlayerContainer');
      document.getElementById('modalTitle').innerText = title;
      
      if (url.includes('<iframe') || url.includes('http')) {
        if (url.includes('<iframe')) {
          videoContainer.innerHTML = url;
          const iframe = videoContainer.querySelector('iframe');
          if (iframe) {
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.style.width = '100%';
            iframe.style.height = '100%';
          }
        } else if (url.endsWith('.mp4') || url.endsWith('.webm') || url.includes('cloudinary')) {
          videoContainer.innerHTML = `<video src="${url}" controls autoplay controlsList="nodownload" allowfullscreen oncontextmenu="return false;"></video>`;
        } else {
          videoContainer.innerHTML = `<iframe src="${url}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="width:100%; height:100%;"></iframe>`;
        }
      }

      modal.style.display = 'flex';
    };

    window.closePlayer = () => {
      const modal = document.getElementById('playerModal');
      const videoContainer = document.getElementById('videoPlayerContainer');
      videoContainer.innerHTML = "";
      modal.style.display = 'none';
    };
  </script>
</body>
</html>
