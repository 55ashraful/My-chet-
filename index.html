<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Video Portal</title>

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" href="https://i.ibb.co/zWvmyGPT/1000109018.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      -webkit-user-select: none;
      user-select: none;
    }
    
    input { user-select: auto; }

    body { background-color: #0f0f0f; color: #ffffff; padding-bottom: 70px; overflow-x: hidden; }

    /* Header */
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 12px 16px; 
      background: #181818; 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      border-bottom: 1px solid #282828; 
    }
    .logo { font-size: 18px; font-weight: 800; color: #e50914; display: flex; align-items: center; gap: 6px; text-decoration: none; }
    .logo span { color: #fff; background: #e50914; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .header-icons { font-size: 18px; color: #fff; cursor: pointer; }

    /* Search Bar */
    .search-box {
      display: none;
      padding: 10px 14px;
      background: #181818;
      border-bottom: 1px solid #282828;
    }
    .search-input-wrapper {
      display: flex;
      align-items: center;
      background: #282828;
      border-radius: 20px;
      padding: 6px 14px;
    }
    .search-input-wrapper i { color: #aaa; margin-right: 8px; }
    .search-input-wrapper input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      color: #fff;
      font-size: 13px;
    }

    /* Dynamic Banner Slider */
    .hero-slider-wrapper { 
      overflow-x: auto; 
      display: flex; 
      scroll-snap-type: x mandatory; 
      scrollbar-width: none; 
      padding: 12px; 
      gap: 12px; 
    }
    .hero-slider-wrapper::-webkit-scrollbar { display: none; }
    .hero-banner { 
      flex: 0 0 100%; 
      height: 160px; 
      scroll-snap-align: start; 
      position: relative; 
      border-radius: 12px; 
      overflow: hidden; 
      display: flex; 
      align-items: flex-end; 
      padding: 12px; 
      background-size: cover; 
      background-position: center; 
      cursor: pointer;
    }
    .hero-banner::before { content:''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
    .hero-content { position: relative; z-index: 2; color: #fff; }
    .hero-title { font-size: 16px; font-weight: 700; }
    .btn-play { background: #e50914; color: #fff; border: none; padding: 6px 14px; border-radius: 20px; font-size: 11px; cursor: pointer; margin-top: 6px; }

    /* Category Filter Bar */
    .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; scrollbar-width: none; background: #121212; }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-btn { background: #272727; color: #ccc; border: none; padding: 6px 14px; border-radius: 16px; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: #e50914; color: #fff; font-weight: bold; }

    /* Video Section Block */
    .category-section { margin-bottom: 20px; }
    .section-header { padding: 12px 12px 8px 12px; }
    .section-title { font-size: 15px; font-weight: 700; color: #fff; border-left: 4px solid #e50914; padding-left: 8px; }

    /* Video Cards Grid */
    .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 12px; }
    
    .poster-card { 
      background: #1f1f1f; 
      border-radius: 8px; 
      overflow: hidden; 
      cursor: pointer; 
      position: relative; 
      height: 140px;
    }
    .poster-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .poster-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 60%); z-index: 1; }
    
    .play-overlay { 
      position: absolute; 
      top: 45%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      width: 30px; 
      height: 30px; 
      background: rgba(229, 9, 20, 0.9); 
      border-radius: 50%; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: #fff; 
      font-size: 12px; 
      z-index: 2;
    }

    .poster-title-overlay { 
      position: absolute; 
      bottom: 6px; 
      left: 0; 
      width: 100%; 
      padding: 0 4px;
      z-index: 3;
    }
    
    .poster-title-text {
      color: #ffffff; 
      font-size: 11px; 
      font-weight: 500; 
      text-align: center;
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
      display: block;
    }

    /* Fixed Bottom Navigation */
    .bottom-nav { 
      position: fixed; 
      bottom: 0; 
      left: 0; 
      width: 100%; 
      height: 60px;
      background: #181818; 
      display: flex; 
      justify-content: space-around; 
      align-items: center; 
      border-top: 1px solid #282828; 
      z-index: 1000; 
    }
    .nav-link { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      color: #888; 
      text-decoration: none; 
      font-size: 11px; 
      cursor: pointer; 
    }
    .nav-link i { font-size: 18px; margin-bottom: 3px; }
    .nav-link.active { color: #e50914; font-weight: bold; }

    /* Player Modal */
    .player-modal { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.95); 
      z-index: 2000; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
    }

    .video-box-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      background: #000;
      aspect-ratio: 16 / 9;
    }

    .video-box-wrapper video, .video-box-wrapper iframe { width: 100%; height: 100%; border: none; }

    .close-modal { 
      position: absolute; 
      top: 15px; 
      right: 20px; 
      color: #fff; 
      font-size: 32px; 
      cursor: pointer; 
      z-index: 2001; 
    }

    .modal-title { margin-top: 14px; font-size: 14px; color: #fff; text-align: center; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { firebaseConfig } from './config.js';

    let db;
    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch (e) {
      console.error("Firebase init failed: ", e);
    }

    let allVideos = {};
    let categoriesList = [];
    let selectedCat = "All";
    let searchQuery = "";

    if (db) {
      // Load Categories
      onValue(ref(db, 'categories'), (snapshot) => {
        categoriesList = [];
        const data = snapshot.val();
        if (data) {
          Object.keys(data).forEach(key => {
            if (data[key].name) categoriesList.push(data[key].name);
          });
        }
        renderCategoryBar();
      });

      // Load All Videos
      onValue(ref(db, 'videos'), (snapshot) => {
        allVideos = snapshot.val() || {};
        renderVideos();
      });

      // Load Banners
      onValue(ref(db, 'heroBanners'), (snapshot) => {
        const heroSlider = document.getElementById('heroSlider');
        if (!heroSlider) return;
        heroSlider.innerHTML = "";
        const data = snapshot.val();
        if (data) {
          Object.values(data).forEach(b => {
            const div = document.createElement('div');
            div.className = 'hero-banner';
            div.style.backgroundImage = `url('${b.imgUrl || ''}')`;
            div.onclick = () => { if (b.videoUrl) openVideoPlayer(b.videoUrl, b.title); };
            div.innerHTML = `
              <div class="hero-content">
                <div class="hero-title">${b.title || ''}</div>
                <button class="btn-play"><i class="fa-solid fa-play"></i> Watch</button>
              </div>
            `;
            heroSlider.appendChild(div);
          });
        }
      });
    }

    function renderCategoryBar() {
      const catBar = document.getElementById('catBar');
      if (!catBar) return;
      catBar.innerHTML = "";

      const allBtn = document.createElement('button');
      allBtn.className = `cat-btn ${selectedCat === 'All' ? 'active' : ''}`;
      allBtn.innerText = "All";
      allBtn.onclick = () => filterCat('All', allBtn);
      catBar.appendChild(allBtn);

      categoriesList.forEach(catName => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${selectedCat === catName ? 'active' : ''}`;
        btn.innerText = catName;
        btn.onclick = () => filterCat(catName, btn);
        catBar.appendChild(btn);
      });
    }

    window.filterCat = (catName, btnElement) => {
      selectedCat = catName;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      renderVideos();
    };

    function renderVideos() {
      const mainContainer = document.getElementById('mainContentContainer');
      if (!mainContainer) return;
      mainContainer.innerHTML = "";

      const keys = Object.keys(allVideos).reverse();
      const groupedVideos = {};

      keys.forEach(key => {
        const item = allVideos[key];
        const category = (item && item.category && item.category.trim() !== "") ? item.category : "General Videos";
        const titleMatch = !searchQuery || (item && item.title && item.title.toLowerCase().includes(searchQuery.toLowerCase()));

        if (titleMatch && item) {
          if (!groupedVideos[category]) groupedVideos[category] = [];
          groupedVideos[category].push({ key, data: item });
        }
      });

      let totalRendered = 0;

      Object.keys(groupedVideos).forEach(catName => {
        if (selectedCat !== "All" && selectedCat !== catName) return;

        const videoList = groupedVideos[catName];
        if (videoList && videoList.length > 0) {
          totalRendered += videoList.length;

          const section = document.createElement('div');
          section.className = 'category-section';

          const secHeader = document.createElement('div');
          secHeader.className = 'section-header';
          secHeader.innerHTML = `<span class="section-title">${catName}</span>`;

          const grid = document.createElement('div');
          grid.className = 'mini-grid';

          videoList.forEach(obj => {
            grid.appendChild(createCard(obj.key, obj.data));
          });

          section.appendChild(secHeader);
          section.appendChild(grid);
          mainContainer.appendChild(section);
        }
      });

      if (totalRendered === 0) {
        mainContainer.innerHTML = "<p style='color:#888; font-size:12px; text-align:center; padding:40px;'>কোনো ভিডিও লোড হয়নি বা ভিডিও নেই!</p>";
      }
    }

    function createCard(key, item) {
      const card = document.createElement('div');
      card.className = 'poster-card';
      
      const rawCover = item.imgUrl || item.posterUrl || item.thumbnailUrl;
      const coverImage = (rawCover && rawCover.trim() !== '') ? rawCover : 'https://via.placeholder.com/300x450/191919/ffffff?text=Video';

      card.onclick = () => openVideoPlayer(item.videoUrl, item.title);

      card.innerHTML = `
        <img src="${coverImage}" class="poster-img" alt="${item.title || ''}">
        <div class="play-overlay"><i class="fa-solid fa-play"></i></div>
        <div class="poster-title-overlay">
          <span class="poster-title-text">${item.title || 'Untitled'}</span>
        </div>
      `;
      return card;
    }

    window.toggleSearch = () => {
      const searchBox = document.getElementById('searchBox');
      if (searchBox) searchBox.style.display = searchBox.style.display === 'block' ? 'none' : 'block';
    };

    window.handleSearch = (e) => {
      searchQuery = e.target.value.trim();
      renderVideos();
    };

    window.openVideoPlayer = (url, title) => {
      if (!url) return;
      const modal = document.getElementById('playerModal');
      const videoContainer = document.getElementById('videoPlayerContainer');
      document.getElementById('modalTitle').innerText = title || '';
      
      if (url.includes('<iframe')) {
        videoContainer.innerHTML = url;
      } else if (url.endsWith('.mp4')) {
        videoContainer.innerHTML = `<video src="${url}" controls autoplay allowfullscreen></video>`;
      } else {
        videoContainer.innerHTML = `<iframe src="${url}" frameborder="0" allowfullscreen style="width:100%; height:100%;"></iframe>`;
      }

      modal.style.display = 'flex';
    };

    window.closePlayer = () => {
      document.getElementById('playerModal').style.display = 'none';
      document.getElementById('videoPlayerContainer').innerHTML = "";
    };
  </script>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="logo">
      <i class="fa-solid fa-circle-play"></i> SECRET<span>VIDEO</span>
    </a>
    <div class="header-icons">
      <i class="fa-solid fa-magnifying-glass" onclick="toggleSearch()"></i>
    </div>
  </header>

  <!-- Search -->
  <div class="search-box" id="searchBox">
    <div class="search-input-wrapper">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="ভিডিও খুঁজুন..." oninput="handleSearch(event)">
    </div>
  </div>

  <div class="hero-slider-wrapper" id="heroSlider"></div>
  <div class="cat-bar" id="catBar"></div>
  <div id="mainContentContainer"></div>

  <!-- Player Modal -->
  <div class="player-modal" id="playerModal">
    <span class="close-modal" onclick="closePlayer()">&times;</span>
    <div class="video-box-wrapper" id="videoPlayerContainer"></div>
    <div class="modal-title" id="modalTitle"></div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a class="nav-link active">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </a>
  </nav>

</body>
</html>
